# Supermemory Local on Windows, no Ubuntu shell required.
#   docker compose up            # first boot prints your sm_... API key in the logs
# Trace runs on Windows (npm run dev) and reaches this at http://localhost:6767.
# Ollama runs natively on Windows (ollama app); the container reaches it via
# host.docker.internal, so the whole loop stays on your machine.
services:
  supermemory:
    build: .
    container_name: supermemory-local
    ports:
      - "6767:6767"
    environment:
      SUPERMEMORY_DATA_DIR: /data
      # Fully offline extraction via Ollama on the Windows host.
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OPENAI_API_KEY: ollama
      OPENAI_MODEL: qwen2.5:7b
    volumes:
      - ./.supermemory:/data
    extra_hosts:
      # Lets the container resolve the Windows host (for Ollama).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
